[package]
name = "integration-tests"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dev-dependencies]
# 0.23 because it shares near-crypto 0.37 with near-sdk 5.29.1 (0.24 needs near-crypto 0.38, and
# the two pin incompatible aws-lc-rs versions). The node itself is chosen in tests/sandbox.rs.
near-workspaces = "0.23.0"
near-sandbox = "0.3.16"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
sha3 = "0.10"
ripemd = "0.1"
hex = "0.4"
bs58 = "0.5"
bech32 = "0.11"
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }
ed25519-dalek = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
